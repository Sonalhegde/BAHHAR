name: Backend ML Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test_ml_service:
    name: Python Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        # `python -m pytest` (not bare `pytest`) puts the service directory on
        # sys.path so tests can `import main`; pytest's own rootdir insertion
        # only adds tests/, which caused ModuleNotFoundError: No module named 'main'.
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests/
