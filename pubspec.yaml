name: bahhar
description: "Bahhar AI - Oman-specific smart fishing companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4

  # Maps — MapLibre GL rendering keyless OpenFreeMap vector tiles
  # (Master Build Prompt v3 §2/§3.5 — no API key, no Google Maps SDK)
  maplibre_gl: ^0.27.0

  # UI & Vector
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # Social & Device Capabilities
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
