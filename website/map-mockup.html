<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHHAR — Fishing Map</title>
    <!-- Pinned version + SRI: a CDN swap cannot execute in this page's origin unpicked. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #e8f0f4 0%, #dce9ef 100%);
            overflow: hidden;
        }
        #map { position: absolute; inset: 0; width: 100%; height: 100%; }
        /* The particle-flow canvas rides above the tiles but never takes input:
           every drag, wheel and click still belongs to Leaflet underneath.
           (#flow-tint, the blurred speed texture, is inserted by the renderer
           at z-index 499 — below the streaks, above the tiles.) */
        #flow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; }
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            background: rgba(248, 251, 252, 0.92);
            backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
            padding: 13px 20px; z-index: 1000;
            border-bottom: 1px solid rgba(24, 36, 48, 0.08);
        }
        /* A thin live-data accent: the header says "chart instrument", not "web page". */
        .header::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -1.5px; height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(15, 122, 122, 0.55) 30%, rgba(91, 199, 195, 0.7) 55%, transparent);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 17px; font-weight: 800; color: #182430; letter-spacing: -0.015em; }
        .title small { font-size: 10px; font-weight: 700; color: #0f7a7a; letter-spacing: .1em; text-transform: uppercase; margin-left: 8px; opacity: .8; }
        .filter { font: 600 13px/1 'Public Sans', system-ui, sans-serif; color: #0f7a7a; background: none; border: 0; padding: 6px 0; cursor: pointer; }
        .filter:hover { text-decoration: underline; }
        .filter:focus-visible { outline: 2px solid #0f7a7a; outline-offset: 3px; }
        .legend {
            position: absolute; bottom: 14px; left: 14px;
            background: rgba(248, 251, 252, 0.95);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 13px 15px; border-radius: 14px;
            border: 1px solid rgba(24, 36, 48, 0.06);
            box-shadow: 0 6px 22px rgba(23, 46, 66, 0.14); z-index: 1000;
        }
        .legend-title { font-size: 10px; font-weight: 700; color: #5a6c7d; letter-spacing: 0.06em; margin-bottom: 9px; text-transform: uppercase; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #182430; }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 1px 2px rgba(255,255,255,.5), 0 1px 3px rgba(0,0,0,.15); }
        .good { background: radial-gradient(circle at 35% 30%, #2ea08f, #0f7a7a); }
        .moderate { background: radial-gradient(circle at 35% 30%, #e8d3ac, #d8b98c); }
        .protected { width: 34px; height: 13px; border-radius: 3px; background: rgba(15, 122, 122, 0.12); border: 1px dashed #0f7a7a; }
        /* ── Flow sidebar: the read-out half of the wind/current layer ── */
        .sidebar {
            position: absolute; top: 66px; right: 12px; width: 216px;
            max-height: calc(100% - 92px); overflow-y: auto;
            background: rgba(248, 251, 252, 0.95);
            backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25);
            border: 1px solid rgba(24, 36, 48, 0.07);
            border-radius: 14px; padding: 13px 14px; z-index: 1000;
            box-shadow: 0 6px 22px rgba(23, 46, 66, 0.14);
        }
        .side-title { font-size: 10px; font-weight: 800; color: #5a6c7d; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 9px; }
        .seg { display: flex; gap: 4px; margin-bottom: 11px; background: rgba(24, 36, 48, 0.05); border-radius: 9px; padding: 3px; }
        .seg button {
            flex: 1; font: 700 11.5px/1 'Public Sans', system-ui, sans-serif;
            color: #40566a; background: transparent;
            border: 0; border-radius: 7px;
            padding: 6px 0; cursor: pointer;
            transition: background .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .seg button:hover { color: #0f7a7a; }
        .seg button.on {
            background: linear-gradient(180deg, #14907f, #0f7a7a);
            color: #fff; box-shadow: 0 2px 8px rgba(15, 122, 122, 0.35), inset 0 1px 0 rgba(255,255,255,.18);
        }
        .seg button:focus-visible { outline: 2px solid #0f7a7a; outline-offset: 2px; }
        .chk { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #182430; margin-bottom: 6px; cursor: pointer; }
        .chk input { accent-color: #0f7a7a; }
        .scale { height: 8px; border-radius: 4px; margin: 9px 0 4px; box-shadow: inset 0 1px 2px rgba(23, 46, 66, 0.18); }
        .scale-labels { display: flex; justify-content: space-between; font-size: 9.5px; color: #5a6c7d; margin-bottom: 9px; }
        .readout {
            font-size: 12px; line-height: 1.55; color: #182430;
            background: linear-gradient(180deg, rgba(15, 122, 122, 0.05), rgba(24, 36, 48, 0.05));
            border: 1px solid rgba(24, 36, 48, 0.06);
            border-radius: 10px; padding: 9px 10px; min-height: 52px;
        }
        .readout b { font-weight: 800; }
        .readout .dim { color: #5a6c7d; font-size: 11px; }
        /* Micro speed bars inside the read-out: the number stays exact, the bar stays glanceable. */
        .rbar { display: block; height: 3px; border-radius: 2px; background: rgba(24, 36, 48, 0.08); margin: 3px 0 5px; overflow: hidden; }
        .rbar i {
            display: block; height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, #5bc7c3, #0f7a7a 55%, #c2743a);
            transition: width .25s ease;
        }
        .side-note { font-size: 10px; color: #5a6c7d; line-height: 1.55; margin-top: 9px; }
        .side-note.live { color: #0f7a7a; }
        .side-note.sample { color: #b98f4f; }
        .leaflet-marker-icon { background: none; border: none; }
        .custom-marker {
            position: relative; width: 34px; height: 34px;
            background: radial-gradient(circle at 35% 28%, #2aa38f, #0f7a7a 70%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 13px;
            box-shadow: 0 2px 10px rgba(15, 122, 122, 0.45), inset 0 1px 0 rgba(255,255,255,.3);
            border: 3px solid white;
            transition: opacity 0.25s ease, transform 0.2s ease;
        }
        .leaflet-marker-icon:hover .custom-marker { transform: scale(1.12); }
        .moderate-marker { background: radial-gradient(circle at 35% 28%, #d9b478, #b98f4f 70%); box-shadow: 0 2px 10px rgba(185, 143, 79, 0.45), inset 0 1px 0 rgba(255,255,255,.3); }
        /* Slow sonar halo on high-score spots — life on the chart without noise. */
        .halo { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 0 2px rgba(15, 122, 122, 0.35); animation: pulse 2.6s ease-out infinite; }
        .halo:has(+ .moderate-marker) { box-shadow: 0 0 0 2px rgba(185, 143, 79, 0.35); }
        @keyframes pulse {
            0% { transform: scale(1); opacity: .8; }
            70% { transform: scale(2.1); opacity: 0; }
            100% { transform: scale(2.1); opacity: 0; }
        }
        /* The reserve border creeps — a static dashed ring reads as dead UI. */
        .reserve-ring { animation: dash-creep 26s linear infinite; }
        @keyframes dash-creep { to { stroke-dashoffset: -200; } }
        @media (prefers-reduced-motion: reduce) {
            .halo, .reserve-ring { animation: none; }
        }
        /* Leaflet's default container grey shows through every tile that has not
           arrived yet, which read as a grid of empty cells. Match the sea tone. */
        .leaflet-container { font-family: 'Public Sans', system-ui, sans-serif; background: #dfe8ee; }
        /* Stock OSM tiles put roads in saturated orange/red, which fought the cool chrome
           around this mock; calming them keeps one accent in the frame. */
        .leaflet-tile-pane { filter: saturate(0.62) contrast(0.97) brightness(1.02); }
        .leaflet-control-attribution { font-size: 10px; background: rgba(248, 251, 252, 0.88); border-radius: 6px 6px 0 0; }
        .leaflet-control-attribution a { color: #0f7a7a; }
        /* Narrow phones: the sidebar would crowd the chart, so it becomes a slim band. */
        @media (max-width: 560px) {
            .sidebar { width: calc(100% - 24px); top: auto; bottom: 88px; max-height: 38%; }
            .legend { bottom: auto; top: 66px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="title">Fishing Map<small>Marine charts</small></div>
            <button class="filter" id="filterBtn" type="button" aria-live="polite">Filter: all species ▾</button>
        </div>
    </div>

    <div id="map"></div>
    <canvas id="flow" aria-hidden="true"></canvas>

    <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item"><div class="legend-dot good"></div><span>Excellent (70+)</span></div>
        <div class="legend-item"><div class="legend-dot moderate"></div><span>Good (40–69)</span></div>
        <div class="legend-item"><div class="protected"></div><span>Protected Area</span></div>
    </div>

    <aside class="sidebar" aria-label="Wind and current flow layer">
        <div class="side-title">Wind &amp; Current Flow</div>
        <div class="seg" role="group" aria-label="Flow layer mode">
            <button id="mWind" type="button" class="on">Wind</button>
            <button id="mCur" type="button">Current</button>
            <button id="mOff" type="button">Off</button>
        </div>
        <label class="chk"><input type="checkbox" id="tSpots" checked> Fishing spots</label>
        <label class="chk"><input type="checkbox" id="tProt" checked> Protected area</label>
        <div class="scale" id="flowScale" aria-hidden="true"></div>
        <div class="scale-labels"><span id="scaleLo">calm</span><span id="scaleHi">strong</span></div>
        <div class="readout" id="readout"><span class="dim">Move over the chart to read wind and current at that spot.</span></div>
        <div class="side-note" id="srcNote">Loading flow data…</div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script type="module" src="assets/js/map-page.js"></script>
</body>
</html>
