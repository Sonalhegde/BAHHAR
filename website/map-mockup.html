<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHHAR — Fishing Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: #eaf1f0;
            overflow: hidden;
        }
        #map { position: absolute; inset: 0; width: 100%; height: 100%; }
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            background: rgba(250, 248, 244, 0.94);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 14px 20px; z-index: 1000;
            border-bottom: 1px solid rgba(24, 36, 48, 0.07);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 17px; font-weight: 700; color: #182430; letter-spacing: -0.01em; }
        .filter { font: 600 13px/1 'Public Sans', system-ui, sans-serif; color: #0f7a7a; background: none; border: 0; padding: 6px 0; cursor: pointer; }
        .filter:focus-visible { outline: 2px solid #0f7a7a; outline-offset: 3px; }
        .legend {
            position: absolute; bottom: 14px; left: 14px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 13px 15px; border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); z-index: 1000;
        }
        .legend-title { font-size: 10px; font-weight: 700; color: #5a6c7d; letter-spacing: 0.05em; margin-bottom: 9px; text-transform: uppercase; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #182430; }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
        .good { background: #0f7a7a; }
        .moderate { background: #d8b98c; }
        .protected { width: 34px; height: 13px; border-radius: 3px; background: rgba(15, 122, 122, 0.12); border: 1px dashed #0f7a7a; }
        .leaflet-marker-icon { background: none; border: none; }
        .custom-marker {
            width: 34px; height: 34px; background: #0f7a7a; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 13px;
            box-shadow: 0 2px 8px rgba(15, 122, 122, 0.4); border: 3px solid white;
            transition: opacity 0.25s ease;
        }
        .moderate-marker { background: #b98f4f; box-shadow: 0 2px 8px rgba(185, 143, 79, 0.4); }
        /* Leaflet's default container grey shows through every tile that has not
           arrived yet, which read as a grid of empty cells. Match the sea tone. */
        .leaflet-container { font-family: 'Public Sans', system-ui, sans-serif; background: #dfeae7; }
        /* Stock OSM tiles put roads in saturated orange/red, which fought the warm-paper
           chrome around this mock; calming them keeps one accent in the frame. */
        .leaflet-tile-pane { filter: saturate(0.62) contrast(0.97) brightness(1.02); }
        .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,0.82); }
        .leaflet-control-attribution a { color: #0f7a7a; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="title">Fishing Map</div>
            <button class="filter" id="filterBtn" type="button" aria-live="polite">Filter: all species ▾</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item"><div class="legend-dot good"></div><span>Excellent (70+)</span></div>
        <div class="legend-item"><div class="legend-dot moderate"></div><span>Good (40–69)</span></div>
        <div class="legend-item"><div class="protected"></div><span>Protected Area</span></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Real OpenStreetMap tiles centred on the Omani coast (Gulf of Oman / Daymaniyat)
        var map = L.map('map', {
            center: [23.72, 58.28],
            zoom: 10,
            zoomControl: false,
            scrollWheelZoom: false,   // don't hijack the landing page's scroll
            dragging: true
        });

        // Tile use requires visible credit to OpenStreetMap - kept on purpose.
        // Leaflet writes this into the control with innerHTML, so the link is real markup.
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Daymaniyat Islands Nature Reserve: protected, permit-controlled water
        L.circle([23.8617, 58.0933], {
            color: '#0f7a7a', fillColor: '#0f7a7a', fillOpacity: 0.1,
            radius: 8000, weight: 2, dashArray: '5, 5'
        }).addTo(map);

        function marker(score, cls) {
            return L.divIcon({
                className: 'leaflet-marker-icon',
                html: '<div class="custom-marker ' + cls + '">' + score + '</div>',
                iconSize: [34, 34], iconAnchor: [17, 17]
            });
        }

        // The three spots match the home-dashboard mock on the landing page.
        var spots = [
            { at: [23.80, 58.12], score: 85, species: 'Kingfish', name: 'Daymaniyat Drop-Off' },
            { at: [23.61, 58.54], score: 72, species: 'Hammour', name: 'Mutrah Rocky Bank' },
            { at: [23.55, 58.28], score: 68, species: 'Grouper', name: 'Al Bustan Reef', moderate: true }
        ];
        spots.forEach(function (s) {
            s.marker = L.marker(s.at, { icon: marker(String(s.score), s.moderate ? 'moderate-marker' : ''), title: s.name }).addTo(map);
        });

        // Filter is a working control: cycle the target species, dim the rest.
        var faces = ['all species'].concat(spots.map(function (s) { return s.species; }));
        var face = 0;
        var btn = document.getElementById('filterBtn');
        btn.addEventListener('click', function () {
            face = (face + 1) % faces.length;
            var want = faces[face];
            btn.textContent = 'Filter: ' + want + ' ▾';
            spots.forEach(function (s) {
                var el = s.marker.getElement();
                if (el) el.querySelector('.custom-marker').style.opacity =
                    (want === 'all species' || s.species === want) ? '1' : '0.3';
            });
        });
    </script>
</body>
</html>
